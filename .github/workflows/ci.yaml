// これは何？
// nameってなに？これはワークフローの名前を指定するものです。
name: hello-world

// onってなに？これはワークフローを実行するトリガーを指定するものです。
// これはプルリクエストが作成されたときにワークフローを実行する設定です。
// branchesってなに？これはどのブランチに対してプルリクエストが作成されたときにワークフローを実行するかを指定するものです。
on:
  pull_request:
    branches:[main]

// jobsってなに？これはワークフローで実行するジョブを定義するものです。
// ワークフローってなんですか？一連の動作を自動化する仕組みのこと。
jobs:
  hello:
    // runs-onってなに？これはジョブを実行する環境を指定するものです。
    // ubuntu-latestは最新のUbuntu環境を使用することを指定しています。 他にもあるの？はい、例えばwindows-latestやmacos-latestなどがあります。何が違うの？
    // それぞれのOS環境で利用できるソフトウェアや設定が異なります。 料金も？はい、GitHub Actionsの利用には無料枠がありますが、OSや使用量によっては追加料金が発生することがあります。

    runs-on: ubuntu-latest
    // stepsってなに？これはジョブ内で実行する一連のステップを定義するものです。
    steps:
      // actions/checkout@v4はリポジトリのコードをチェックアウトするアクションです。
      // これにより、リポジトリのコードがジョブ内で利用可能になります。よくわからないです。
      // actions/checkout@v4と@v2の違いは、主にバージョンの違いです。最新の機能や修正が含まれているのは@v4です。
      // 最新は@v4です。
      - uses: actions/checkout@v4
