# npmテストとe2eテストが実行されるワークフローです。
name: check-tests

on:
  pull_request:
    branches:
      - main
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: テストを実行
        run: npm test

      - name: Playwrightの依存関係をインストール
        run: npx playwright install --with-deps chromium

      - name: e2eテストを実行
        run: npm run test:e2e

      - name: e2eテスト結果をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2eテスト結果
          path: playwright-report/
