# npmテストとe2eテストが実行されるワークフローです。
name: check-tests

# プッシュする度にワークフローが実行されます。
# プルリクエストが作成されたときにもワークフローが実行されます。
on:
  pull_request:
    branches:
      - main
  push:

jobs:
  test:
    # テストジョブの定義
    # Ubuntu環境がはいった仮想マシン上でジョブが実行される。
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      # - name: Node.jsをセットアップ
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: 22
      #     cache: npm

      # - name: 依存関係をインストール
      #   run: npm ci

      - name: テストを実行
        run: npm test
